      // and stay blank. While the screen is still blank and online: 1st try updates the service worker, 2nd removes it and
      // its file cache; each then reloads. At most 2 tries a tab; 5 s of a drawn screen clears the count; past 2, a message.
      (function () {
        var KEY = 'ppyong:asset-recover', MAX = 2, busy = false;
        var count = function () { try { return Number(sessionStorage.getItem(KEY) || 0); } catch (e) { return MAX; } };
        var blank = function () { var r = document.getElementById('root'); return !r || !r.firstElementChild; };
        var reload = function () { location.reload(); };
        function stuck() {
          var r = document.getElementById('root');
          if (!r || r.firstElementChild) return;
          r.innerHTML = '<div style="padding:32px 20px;text-align:center;font:18px/1.5 system-ui,sans-serif"><p>화면을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.</p>'
            + '<button type="button" style="min-height:56px;padding:0 24px;font:inherit;font-weight:700;border-radius:16px;border:0;background:#2f6fd6;color:#fff">다시 열기</button></div>';
          r.querySelector('button').onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} reload(); };
        }
        function recover() {
          if (busy || !blank() || !navigator.onLine) return;
          var n = count();
          if (n >= MAX) { stuck(); return; }
          busy = true;
          sessionStorage.setItem(KEY, String(n + 1));
          var sw = navigator.serviceWorker, step;
          if (!sw) step = Promise.resolve();
          else if (n === 0) {
            step = sw.getRegistration().then(function (reg) {
              if (!reg) return;
              return reg.update().then(function () { var w = reg.waiting; if (w) w.postMessage({ type: 'SKIP_WAITING' }); });
            });
          } else {
            step = sw.getRegistrations()
              .then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); })
              .then(function () { return caches.keys(); })
              .then(function (keys) { return Promise.all(keys.filter(function (k) { return /^workbox-precache/.test(k); }).map(function (k) { return caches.delete(k); })); });
          }
          step.then(reload, reload);
          setTimeout(reload, 4000);
        }
        // a script or style of the build that failed to load (capture: load errors do not bubble), or a lazy chunk
        addEventListener('error', function (e) {
          var t = e.target, src = t && (t.src || t.href);
          if (typeof src === 'string' && src.indexOf('/assets/') >= 0) recover();
        }, true);
        addEventListener('vite:preloadError', recover);
        addEventListener('load', function () {
          setTimeout(function () { if (!blank()) { try { sessionStorage.removeItem(KEY); } catch (e) {} } }, 5000);
          // nothing drawn long after loading (an error no event reported)
          setTimeout(function () { if (blank()) recover(); }, 12000);
        });
      })();
    </script>
